<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>練習記録を追加する</title>
</head>
<body>
    <form action="/darts_add">
        <label for="id">ID</label>
        <input type="number" name="id" id="id" required>

        <label for="date">日付</label>
        <input type="date" name="date" id="date" required>

        <label for="game">ゲーム</label>
        <input type="text" name="game" id="game" value="カウントアップ" required>

        <label for="score">スコア</label>
        <input type="number" name="score" id="score" step="any" required>

        <label for="place">場所</label>
        <input type="text" name="place" id="place" required>

        <input type="submit" value="登録">
    </form>
    <a href="/darts">練習記録の一覧へ</a>
</body>
</html>
